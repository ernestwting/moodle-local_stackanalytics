name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Kept to one PHP/Moodle/DB combination for now (an alpha-stage
        # personal project, not a plugin-directory submission yet) — widen
        # this matrix once the suite is passing reliably. MOODLE_405_STABLE
        # matches the real Moodle 4.5 checkout this plugin's Analytics API
        # usage was verified against during development.
        php: ['8.2']
        moodle-branch: ['MOODLE_405_STABLE']
        database: [pgsql]

    steps:
      # qtype_stack's own db/install.php unconditionally tries to build an
      # optimised Maxima image whenever PHPUNIT_TEST is true (which it is
      # during moodle-plugin-ci's own phpunit-init sub-step), throwing a
      # coding_exception if no working `maxima` binary is available — this
      # is exactly what failed in run #2 of this workflow ("maxima_opt_auto
      # creation failed. Time taken = 0"). Confirmed by reading
      # question/type/stack/db/install.php directly, not guessed. The real
      # qtype_stack project's own CI (.github/workflows/moodle-ci.yml)
      # installs a specific pinned Maxima build via sourceforge .deb files;
      # this uses Ubuntu's own packaged `maxima` instead, which auto-detects
      # fine as connectorhelper.class.php's Lisp-backend detection (GCL/
      # SBCL/CLISP) reads `maxima`'s own build info rather than assuming one.
      - name: Install Maxima (required by qtype_stack)
        run: |
          sudo apt-get update
          # --no-install-recommends: plain `apt-get install maxima` pulls in
          # a full TeX Live distribution as a recommended (docs-building)
          # dependency, which costs several minutes and gigabytes for
          # something this workflow never uses.
          sudo apt-get install -y --no-install-recommends maxima
          echo "diff(x^2, x); quit();" | maxima --very-quiet

      # Installing a working `maxima` binary (above) was necessary but not
      # sufficient — run #3 still failed the same way, meaning Ubuntu's
      # packaged Maxima isn't a drop-in match for whatever
      # create_auto_maxima_image() (question/type/stack/stack/cas/connectorhelper.class.php)
      # expects to compile against. install.php's own guard condition offers
      # a documented escape hatch instead of fighting that: it skips the
      # optimised-image build entirely if QTYPE_STACK_TEST_CONFIG_PLATFORM is
      # defined as 'server', 'server-proxy', or 'none' *before* its
      # PHPUNIT_TEST branch runs. `moodle-plugin-ci add-config` can't do this
      # — its own source (AddConfigCommand.php) confirms it edits config.php
      # *after* `install` completes, by which point install.php has already
      # run and crashed. PHP's auto_prepend_file (set on the PHP setup step
      # below) instead guarantees the constant exists for every PHP process
      # in this job from the start, including moodle-plugin-ci's internal
      # phpunit-init sub-step — sidestepping the Maxima-compatibility
      # question entirely rather than continuing to guess at it blind.
      - name: Write qtype_stack CI override (skip its optimised-Maxima-image build)
        run: echo "<?php define('QTYPE_STACK_TEST_CONFIG_PLATFORM', 'none');" > "${{ github.workspace }}/qtype_stack_ci_override.php"

      - name: Check out this plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      # qtype_stack is a required dependency (version.php) not shipped with
      # core, so moodle-plugin-ci needs it checked out separately and told
      # about it via EXTRA_PLUGINS_DIR — the real repository location
      # (github.com/maths/moodle-qtype_stack) was confirmed from a CDN URL
      # inside qtype_stack's own mkdocs.yml, not guessed.
      - name: Check out qtype_stack (required plugin dependency)
        uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          path: extra-plugins/qtype_stack

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1, auto_prepend_file=${{ github.workspace }}/qtype_stack_ci_override.php
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          EXTRA_PLUGINS_DIR: ${{ github.workspace }}/extra-plugins

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        continue-on-error: true # First run against an unreviewed codebase — see CHANGELOG's Phase 7 entry.
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        continue-on-error: true # Same reasoning as Code Checker above.
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
